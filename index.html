<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYTHOS DASHBOARD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'primary': '#1a1a1a',
              'secondary': '#2a2a2a',
              'accent': '#3a3a3a',
              'text-primary': '#e0e0e0',
              'text-secondary': '#b0b0b0',
              'brand': '#52525b', // Neutral gray for buttons/focus
              'brand-hover': '#71717a', // Lighter gray for hover
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      ::-webkit-scrollbar {
        display: none;
      }

      /* Hide scrollbar for IE, Edge and Firefox */
      * {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      
      /* Custom Markdown styles */
      .markdown-content {
        color: #e0e0e0;
        line-height: 1.6;
      }
      .markdown-content h1, .markdown-content h2, .markdown-content h3 {
        border-bottom: 1px solid #3a3a3a;
        padding-bottom: 0.3em;
        margin-top: 24px;
        margin-bottom: 16px;
      }
      .markdown-content p {
        margin-bottom: 16px;
        white-space: pre-wrap; /* maintain whitespace from original message */
      }
      .markdown-content a {
        color: #71717a;
        text-decoration: underline;
      }
      .markdown-content a:hover {
        color: #e0e0e0;
      }
      .markdown-content ul, .markdown-content ol {
        padding-left: 2em;
        margin-bottom: 16px;
      }
      .markdown-content li {
        margin-bottom: 0.25em;
      }
      .markdown-content blockquote {
        border-left: 4px solid #3a3a3a;
        padding-left: 1em;
        margin: 0 0 16px;
        color: #b0b0b0;
      }
      .markdown-content code {
        background-color: #3a3a3a;
        color: #e0e0e0;
        padding: 0.2em 0.4em;
        border-radius: 6px;
        font-family: monospace;
        font-size: 85%;
      }
      .markdown-content pre {
        background-color: #1a1a1a;
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
        margin-bottom: 16px;
      }
      .markdown-content pre code {
        background-color: transparent;
        padding: 0;
        font-size: 100%;
      }
      .markdown-content table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 16px;
      }
      .markdown-content th, .markdown-content td {
        border: 1px solid #3a3a3a;
        padding: 8px 12px;
      }
      .markdown-content th {
        background-color: #2a2a2a;
        font-weight: bold;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.1/",
    "react": "https://esm.sh/react@^19.1.1",
    "@google/genai": "https://esm.sh/@google/genai@^1.14.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "react-markdown": "https://esm.sh/react-markdown@^9.0.1",
    "remark-gfm": "https://esm.sh/remark-gfm@^4.0.0",
    "rehype-raw": "https://esm.sh/rehype-raw@^7.0.0",
    "multer": "https://aistudiocdn.com/multer@^2.0.2",
    "dotenv": "https://aistudiocdn.com/dotenv@^17.2.2",
    "express": "https://aistudiocdn.com/express@^5.1.0",
    "fs": "https://aistudiocdn.com/fs@^0.0.1-security",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "cors": "https://aistudiocdn.com/cors@^2.8.5",
    "pg": "https://aistudiocdn.com/pg@^8.16.3",
    "stream": "https://aistudiocdn.com/stream@^0.0.3"
  }
}
</script>
</head>
  <body class="bg-primary">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
